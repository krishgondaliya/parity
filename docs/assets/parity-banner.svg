<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="parity-title parity-desc">
  <title id="parity-title">Parity</title>
  <desc id="parity-desc">Parity: differential testing for LLM fine-tuning frameworks. What TRL, Axolotl and Unsloth actually train on, checked token by token against an independent reference. The picture shows a reference row and a framework row with the same tokens, where the framework drops the loss on the end-of-turn token.</desc>
  <defs>
    <linearGradient id="parity-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17223b"/>
    </linearGradient>
  </defs>

  <!-- The card carries its own background, so it reads the same on GitHub's light and dark themes. -->
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#parity-bg)" stroke="#2f3f5c" stroke-width="2"/>

  <!-- Name and one-line description. System fonts only. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="128" font-size="76" font-weight="700" fill="#f8fafc" letter-spacing="-1">Parity</text>
    <text x="67" y="174" font-size="21" font-weight="600" fill="#dbe3ee">Differential testing for LLM fine-tuning frameworks</text>
    <text x="67" y="212" font-size="18" fill="#9fb0c6">What TRL, Axolotl and Unsloth actually train on,</text>
    <text x="67" y="238" font-size="18" fill="#9fb0c6">checked token by token against an independent reference.</text>
  </g>

  <line x1="716" y1="58" x2="716" y2="246" stroke="#2f3f5c" stroke-width="2"/>

  <!-- The idea in one picture: same tokens, a different loss mask. -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="744" y="66" font-size="13" fill="#9fb0c6">same tokens, loss compared per token</text>

    <text x="744" y="104" font-size="13" fill="#dbe3ee">reference</text>
    <text x="744" y="174" font-size="13" fill="#dbe3ee">framework</text>

    <!-- reference row: every token of the reply is trained -->
    <g font-size="13" fill="#e8eef6" text-anchor="middle">
      <rect x="822" y="80" width="48" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="846" y="102">The</text>
      <rect x="876" y="80" width="48" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="900" y="102">sky</text>
      <rect x="930" y="80" width="40" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="950" y="102">is</text>
      <rect x="976" y="80" width="52" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="1002" y="102">blue</text>
      <rect x="1034" y="80" width="32" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="1050" y="102">.</text>
      <rect x="1072" y="80" width="88" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="1116" y="102">&lt;|im_end|&gt;</text>
    </g>
    <g fill="#34d399">
      <rect x="822" y="120" width="48" height="7" rx="2"/>
      <rect x="876" y="120" width="48" height="7" rx="2"/>
      <rect x="930" y="120" width="40" height="7" rx="2"/>
      <rect x="976" y="120" width="52" height="7" rx="2"/>
      <rect x="1034" y="120" width="32" height="7" rx="2"/>
      <rect x="1072" y="120" width="88" height="7" rx="2"/>
    </g>

    <!-- framework row: the same tokens, but the end-of-turn token gets no loss -->
    <g font-size="13" fill="#e8eef6" text-anchor="middle">
      <rect x="822" y="150" width="48" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="846" y="172">The</text>
      <rect x="876" y="150" width="48" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="900" y="172">sky</text>
      <rect x="930" y="150" width="40" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="950" y="172">is</text>
      <rect x="976" y="150" width="52" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="1002" y="172">blue</text>
      <rect x="1034" y="150" width="32" height="34" rx="6" fill="#1d2a44" stroke="#3a4d6e"/>
      <text x="1050" y="172">.</text>
      <rect x="1072" y="150" width="88" height="34" rx="6" fill="#2a2414" stroke="#f5a524" stroke-width="2"/>
      <text x="1116" y="172" fill="#fde7b5">&lt;|im_end|&gt;</text>
    </g>
    <g fill="#34d399">
      <rect x="822" y="190" width="48" height="7" rx="2"/>
      <rect x="876" y="190" width="48" height="7" rx="2"/>
      <rect x="930" y="190" width="40" height="7" rx="2"/>
      <rect x="976" y="190" width="52" height="7" rx="2"/>
      <rect x="1034" y="190" width="32" height="7" rx="2"/>
    </g>
    <rect x="1073" y="190.5" width="86" height="6" rx="2" fill="none" stroke="#f5a524" stroke-width="1.5" stroke-dasharray="4 3"/>

    <text x="1160" y="222" font-size="13" fill="#f5a524" text-anchor="end">label -100: never learns to stop</text>

    <!-- legend: filled bar = trained, outlined bar = no loss -->
    <rect x="744" y="236" width="22" height="7" rx="2" fill="#34d399"/>
    <text x="772" y="243" font-size="12" fill="#9fb0c6">loss</text>
    <rect x="818.75" y="236.75" width="20.5" height="5.5" rx="2" fill="none" stroke="#9fb0c6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="846" y="243" font-size="12" fill="#9fb0c6">no loss</text>
  </g>
</svg>
