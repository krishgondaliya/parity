[project]
name = "parity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Krish Gondaliya", email = "k.gondaliya@rutgers.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.33.0",
    "jinja2>=3.1.6",
    "transformers>=5.10.4",
]

[project.scripts]
parity = "parity:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
